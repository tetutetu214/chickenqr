<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ChickenQR は、中央にニワトリ画像を埋め込んだ QR コードをブラウザ上で生成し、PNG としてダウンロードできるツールです。">
  <title>ChickenQR — 中央にニワトリ画像を埋め込む QR コード生成ツール</title>
  <link rel="icon" href="/image/Chicken.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <img class="logo" src="/image/Chicken.png" alt="" width="48" height="48">
      <div>
        <h1>ChickenQR</h1>
        <p>中央にニワトリ画像を埋め込む QR コード生成ツール</p>
      </div>
    </div>
  </header>

  <main class="app-shell">
    <section class="input-panel" aria-labelledby="input-heading">
      <h2 id="input-heading">QR コードを作成</h2>
      <div class="field-group">
        <label for="url-input">URL</label>
        <input
          id="url-input"
          name="url"
          type="url"
          inputmode="url"
          autocomplete="url"
          value="https://example.com"
          placeholder="https://example.com"
        >
      </div>
      <button id="download-button" class="download-button" type="button">
        PNG ダウンロード
      </button>
    </section>

    <section class="preview-panel" aria-labelledby="preview-heading">
      <h2 id="preview-heading">プレビュー</h2>
      <div id="qr-preview" class="qr-preview" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Powered by qr-code-styling / MIT</p>
  </footer>
</body>
</html>
